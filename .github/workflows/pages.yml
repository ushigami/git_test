name: Deploy static guide to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tactical data
        run: node tests/validate-data.js
      - name: Test package calculator
        run: node tests/calculator.test.js
      - name: Verify UI contract
        run: node tests/ui-contract.test.js
      - name: Test unit tech setup rendering
        run: node tests/units-page.test.js
      - name: Smoke test pages
        run: node smoke-test.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
