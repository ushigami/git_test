<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Mechabellum Counter + Package Guide</title>
  <link rel="stylesheet" href="style.css?v=20260830b">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="index.html">COUNTER</a><a href="units.html">UNITS</a><a href="comps.html">COMPS</a>
    </nav>
    <header class="page-head">
      <p class="eyebrow">SEASON 8 · LIVE 1.11.1.3</p>
      <h1>Counter + Package</h1>
      <p>敵unitを一度ずつ選択。最大3unitの役割packageを即時計算します。</p>
    </header>

    <div id="data-status" class="data-status" role="status">Tactical dataを読み込み中…</div>
    <noscript><div class="data-error">JavaScriptが無効なため計算できません。</div></noscript>

    <div class="action-bar">
      <div><span id="enemy-count">ENEMY 0</span><span id="own-count">OWN 0</span></div>
      <button id="clear-all" class="clear-button" type="button">CLEAR ALL</button>
    </div>

    <main>
      <section aria-labelledby="enemy-title">
        <div class="section-head"><h2 id="enemy-title">ENEMY</h2><button id="clear-enemy" class="text-button" type="button">Clear enemy</button></div>
        <div id="enemy-grid" class="unit-grid" aria-label="Enemy units"></div>
      </section>

      <details id="own-panel" class="own-panel">
        <summary>+ OWN ARMY <span>optional</span></summary>
        <div class="section-head own-head"><h2>OWN ARMY</h2><button id="clear-own" class="text-button" type="button">Clear own</button></div>
        <div id="own-grid" class="unit-grid" aria-label="Own army units"></div>
      </details>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-head"><h2 id="results-title">RESULTS</h2><span id="calc-time" class="calc-time"></span></div>
        <p id="result-empty" class="empty">Enemyを選ぶとpackageを表示します。</p>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>No-tech・同Lv・中立配置の判断補助。数量や戦闘結果をシミュレートするものではありません。</p>
    </footer>
  </div>
  <script src="data/units.js?v=20260830d"></script>
  <script src="data/tech-exceptions.js?v=20260830b"></script>
  <script src="data/matchups.js?v=20260830c"></script>
  <script src="data/strategy.js?v=20260830b"></script>
  <script src="calculator.js?v=20260830e"></script>
  <script src="app.js?v=20260830c"></script>
</body>
</html>
